<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2E1065" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g id="mark">
    <!-- coin -->
    <circle cx="492" cy="548" r="300" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="492" cy="548" r="252" fill="none" stroke="#EDE9FE" stroke-width="16"/>
    <!-- rupee sign, drawn as strokes so it renders the same everywhere -->
    <g fill="none" stroke="#6D28D9" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <path d="M392 418 H600"/>
      <path d="M392 490 H600"/>
      <path d="M402 418 H470 C540 418 568 448 568 490 C568 534 532 562 470 562 H402 L560 700"/>
    </g>
    <!-- quick-add spark -->
    <path d="M806 112 L676 356 H772 L722 540 L892 282 H794 L858 112 Z" fill="#FACC15" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" filter="url(#shadow)"/>
  </g>
</svg>
